[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-pattern-engine"
version = "0.1.0"
description = "A mathematical and computational engine for sequences and patterns"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["mathematics", "sequences", "patterns", "fastapi"]

[tool.black]
line-length = 88
